<title>המסע · תאילנד</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* guide.css — "המסע" · עיצוב ערב אנדמן.
   זהות נפרדת משאר האפליקציה: רקע כהה-טורקיז, טיפוגרפיה Secular One + Rubik,
   מנגו זהוב כצבע ראשי ואקווה כמשני. מובייל-first, RTL. */

:root {
  --bg:    #0B1618;
  --bg2:   #0F2126;
  --card:  #14282E;
  --card2: #1A333A;
  --line:  rgba(255,255,255,.10);
  --line2: rgba(255,255,255,.16);
  --ink:   #EDF4F2;
  --ink2:  #9BB2B1;
  --ink3:  #6F8A8A;
  --gold:  #F3B054;
  --aqua:  #55CFC0;
  --coral: #FF8468;
  --shadow: 0 18px 44px rgba(0,0,0,.45);
  --r:     18px;
  --pad:   16px;
}

* { box-sizing: border-box; }
/* הכיוון נקבע ב-CSS ולא רק ב-<html dir> — הבאנדל ל-Artifact לא כולל את תגית ה-html */
html, body { direction: rtl; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.65 Rubik, system-ui, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: "Secular One", Rubik, sans-serif; font-weight: 400; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: inherit; }
img { display: block; max-width: 100%; }

#g { max-width: 860px; margin: 0 auto; }
.eyebrow {
  font: 500 12px/1 Rubik, sans-serif; letter-spacing: .14em;
  color: var(--ink3); text-transform: none; margin-bottom: 12px;
}

/* ───────────────────────── הירו ───────────────────────── */
.hero { position: relative; overflow: hidden; padding: 54px var(--pad) 40px; isolation: isolate; }
.hero::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    radial-gradient(120% 90% at 82% 12%, rgba(243,176,84,.22), transparent 58%),
    radial-gradient(120% 90% at 10% 0%, rgba(85,207,192,.16), transparent 60%),
    linear-gradient(180deg, #0E2229 0%, var(--bg) 96%);
}
.hero-art { position: absolute; inset: 0; z-index: -1; opacity: .5; }
.hero-art svg { width: 100%; height: 100%; }
.hero-art .waves path { fill: none; stroke: rgba(85,207,192,.30); stroke-width: .7; }
.hero-art .sun { fill: none; stroke: rgba(243,176,84,.45); stroke-width: .8; }

.hero .kick {
  display: inline-block; font-size: 12px; letter-spacing: .18em; color: var(--gold);
  border: 1px solid rgba(243,176,84,.35); border-radius: 999px; padding: 5px 12px; margin-bottom: 18px;
}
.hero h1 { font-size: clamp(46px, 15vw, 82px); line-height: .95; }
.hero h1 em { display: block; font-style: normal; color: var(--gold); }
.hero .lede { margin-top: 14px; color: var(--ink2); font-size: 16px; max-width: 30ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.facts li {
  display: flex; align-items: baseline; gap: 6px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line);
  border-radius: 999px; padding: 7px 13px; font-size: 13px; color: var(--ink2);
}
.facts b { font-family: "Secular One", sans-serif; font-size: 15px; color: var(--ink); }

/* ───────────────────── ניווט יעדים (דביק) ───────────────────── */
.chapnav {
  position: sticky; top: 0; z-index: 40;
  display: flex; gap: 8px; padding: 10px var(--pad);
  overflow-x: auto; scrollbar-width: none;
  background: rgba(11,22,24,.82); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.chapnav::-webkit-scrollbar { display: none; }
.chapnav a {
  flex: 0 0 auto; text-decoration: none; font-size: 13.5px; color: var(--ink2);
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px;
  display: flex; align-items: center; gap: 7px; transition: .18s;
}
.chapnav a i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .75; }
.chapnav a.on { color: var(--bg); background: var(--gold); border-color: var(--gold); font-weight: 500; }
.chapnav a.on i { background: rgba(11,22,24,.6); opacity: 1; }

/* ─────────────────── רצועת הלילות ─────────────────── */
.nights { padding: 30px var(--pad) 8px; }
.ribbon { display: flex; gap: 3px; height: 54px; }
.ribbon .d {
  flex: 1 1 0; min-width: 0; border-radius: 6px; position: relative; overflow: hidden;
  background: var(--card); display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 5px; font-size: 10px; color: rgba(255,255,255,.55);
}
.ribbon .d::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: currentColor; opacity: .9; }
.ribbon .d.bangkok { color: var(--coral); }
.ribbon .d.phuket  { color: var(--aqua); }
.ribbon .d.khaolak { color: var(--gold); }
.ribbon .d.air     { color: var(--ink3); }
.ribbon .d.air::before { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 8px); }
.ribbon .d.today { outline: 1.5px solid var(--gold); outline-offset: 1px; }
.ribbon-key { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: 12.5px; color: var(--ink2); }
.ribbon-key span { display: flex; align-items: center; gap: 6px; }
.ribbon-key i { width: 16px; height: 4px; border-radius: 2px; background: currentColor; }
.ribbon-key .bangkok { color: var(--coral); }
.ribbon-key .phuket  { color: var(--aqua); }
.ribbon-key .khaolak { color: var(--gold); }
.ribbon-key .air     { color: var(--ink3); }
.ribbon-key b { color: var(--ink); font-weight: 500; }

/* ───────────────────── טיסות ───────────────────── */
.leg {
  margin: 26px var(--pad); padding: 16px 18px;
  border: 1px dashed var(--line2); border-radius: 14px;
  background: linear-gradient(180deg, rgba(255,255,255,.035), transparent);
}
.leg-top { display: flex; align-items: center; gap: 10px; }
.leg-codes { display: flex; align-items: center; gap: 10px; font-family: "Secular One", sans-serif; font-size: 20px; }
.leg-codes .arrow { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--line2) 0 5px, transparent 5px 10px); position: relative; min-width: 42px; }
.leg-codes .arrow svg { position: absolute; top: 50%; right: 50%; transform: translate(50%, -50%) scaleX(-1); width: 17px; height: 17px; fill: var(--gold); background: var(--bg); padding: 0 3px; }
.leg-when { margin-top: 8px; color: var(--ink2); font-size: 13.5px; }
.leg-when b { color: var(--ink); font-weight: 500; }
.leg-tag { font-size: 11.5px; letter-spacing: .08em; color: var(--ink3); }
.leg-note { margin-top: 8px; font-size: 13px; color: var(--ink3); line-height: 1.55; }

/* ───────────────────── פרק יעד ───────────────────── */
.chapter { padding: 12px var(--pad) 8px; }
.ch-head { display: flex; align-items: flex-start; gap: 14px; margin: 18px 0 20px; }
.ch-num {
  font-family: "Secular One", sans-serif; font-size: 56px; line-height: .8;
  color: transparent; -webkit-text-stroke: 1.2px var(--line2); flex: 0 0 auto;
}
.ch-head h2 { font-size: clamp(30px, 8vw, 40px); }
.ch-head .ch-when { color: var(--gold); font-size: 13.5px; margin-top: 6px; letter-spacing: .02em; }
.ch-head .ch-sub { color: var(--ink3); font-size: 13.5px; margin-top: 3px; }

/* כרטיס המלון */
.stay {
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  background: var(--card); box-shadow: var(--shadow);
}
.stay-img { position: relative; aspect-ratio: 16 / 9; background: var(--card2); }
.stay-img img { width: 100%; height: 100%; object-fit: cover; }
.stay-img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(11,22,24,.86)); }
.stay-img .label {
  position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2;
  background: rgba(11,22,24,.72); backdrop-filter: blur(6px);
  border: 1px solid var(--line2); border-radius: 999px;
  font-size: 11.5px; letter-spacing: .1em; color: var(--gold); padding: 5px 11px;
}
.stay-img h3 {
  position: absolute; z-index: 2; inset-inline: 16px; bottom: 14px;
  font-size: clamp(18px, 5vw, 23px); text-shadow: 0 2px 14px rgba(0,0,0,.6);
}
.stay-body { padding: 16px 18px 18px; }
.stay-area { color: var(--ink2); font-size: 14px; }
.stay-kv { display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; margin: 16px 0 0; font-size: 14px; }
.stay-kv dt { color: var(--ink3); font-size: 13px; }
.stay-kv dd { margin: 0; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.stay-note { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink2); font-size: 13.5px; line-height: 1.6; }

.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.links a {
  text-decoration: none; font-size: 13.5px; padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--line2); color: var(--ink); display: inline-flex; align-items: center; gap: 7px;
  transition: .18s;
}
.links a.primary { background: var(--gold); border-color: var(--gold); color: #10201F; font-weight: 500; }
.links a svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ───────────────────── אטרקציות ───────────────────── */
.sec-head { display: flex; align-items: baseline; gap: 10px; margin: 34px 0 14px; }
.sec-head h3 { font-size: 21px; }
.sec-head span { color: var(--ink3); font-size: 13px; }
.chap-intro { color: var(--ink2); font-size: 13.5px; line-height: 1.6; margin-bottom: 16px; border-inline-start: 2px solid var(--line2); padding-inline-start: 12px; }

.att-grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.att {
  min-width: 0;
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
  background: var(--card); display: flex; flex-direction: column;
}
.att-map { position: relative; aspect-ratio: 2 / 1; background: var(--bg2); }
.att-map .leaflet-container { background: var(--bg2); font: inherit; }
/* אריחי OpenStreetMap בהירים — הופכים אותם למפה כהה שמתאימה לדף */
.att-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.84) saturate(.4); }
.att-map .leaflet-tooltip { background: #14282E; color: var(--ink); border: 1px solid var(--line2); box-shadow: none; }
.att-map .leaflet-tooltip-top::before { border-top-color: var(--line2); }
.att-map svg.schem { width: 100%; height: 100%; display: block; }
.att-map svg.schem .route { fill: none; stroke: var(--gold); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.att-map svg.schem .grid { stroke: rgba(255,255,255,.055); stroke-width: 1; }
.att-map .ride {
  position: absolute; z-index: 500; bottom: 10px; inset-inline-start: 10px;
  display: flex; align-items: center; gap: 8px; pointer-events: none;
  background: rgba(11,22,24,.82); backdrop-filter: blur(8px);
  border: 1px solid var(--line2); border-radius: 999px; padding: 6px 12px 6px 10px;
}
.att-map .ride svg { width: 16px; height: 16px; fill: var(--gold); flex: 0 0 auto; }
.att-map .ride b { font-family: "Secular One", sans-serif; font-size: 15px; }
.att-map .ride span { font-size: 12px; color: var(--ink2); }
.att-map .zoom {
  position: absolute; z-index: 500; bottom: 10px; inset-inline-end: 10px;
  display: flex; align-items: center; gap: 5px; text-decoration: none;
  background: rgba(11,22,24,.82); backdrop-filter: blur(8px); border: 1px solid var(--line2);
  border-radius: 999px; padding: 6px 11px; font-size: 12px; color: var(--ink);
}
.att-map .zoom svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.att-body { padding: 15px 16px 17px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.att-top { display: flex; align-items: flex-start; gap: 9px; }
.att-top h4 { font-size: 19px; flex: 1; }
.cat {
  flex: 0 0 auto; font-size: 11.5px; padding: 4px 9px; border-radius: 7px;
  background: rgba(85,207,192,.13); color: var(--aqua); border: 1px solid rgba(85,207,192,.22);
}
.cat.baby { background: rgba(243,176,84,.13); color: var(--gold); border-color: rgba(243,176,84,.24); }
.att-en { overflow-wrap: anywhere; font-size: 12px; color: var(--ink3); letter-spacing: .01em; margin-top: -4px; }
.att-blurb { font-size: 14.5px; line-height: 1.66; color: #DCE7E5; }
.att-meta { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
.att-meta p { display: flex; gap: 8px; font-size: 13px; color: var(--ink2); line-height: 1.55; }
.att-meta i { flex: 0 0 auto; font-style: normal; opacity: .85; }
.att-peak { color: var(--ink3); font-size: 12.5px; }
.att .links { margin-top: auto; padding-top: 6px; }
.att .links a { font-size: 13px; padding: 8px 12px; }

.empty-att {
  border: 1px dashed var(--line2); border-radius: 14px; padding: 18px;
  color: var(--ink3); font-size: 13.5px; line-height: 1.6;
}

/* ───────────────────── סיום ───────────────────── */
.foot { padding: 40px var(--pad) 54px; color: var(--ink3); font-size: 12.5px; line-height: 1.7; border-top: 1px solid var(--line); margin-top: 40px; }
.foot-note { margin-top: 6px; }

.load-err { margin: 40px var(--pad); padding: 16px; border: 1px solid var(--coral); border-radius: 12px; color: var(--coral); }

/* ───────────────────── תנועה ───────────────────── */
.rise { opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s cubic-bezier(.2,.7,.3,1); }
.rise.in { opacity: 1; transform: none; }

@media (hover: hover) {
  .links a:hover { border-color: var(--gold); color: var(--gold); }
  .links a.primary:hover { color: #10201F; filter: brightness(1.07); }
  .chapnav a:hover { border-color: var(--line2); color: var(--ink); }
  .chapnav a.on:hover { color: var(--bg); }
}

@media (min-width: 720px) {
  :root { --pad: 26px; }
  .att-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding-top: 70px; }
  .ch-num { font-size: 72px; }
  .stay { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .stay-img { aspect-ratio: auto; min-height: 260px; }
  .stay-img h3 { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  .rise { transition: none; opacity: 1; transform: none; }
  * { scroll-behavior: auto !important; }
}

@media print {
  body { background: #fff; color: #111; }
  .chapnav, .att-map, .hero-art { display: none; }
  .att, .stay, .leg { break-inside: avoid; border-color: #ccc; background: #fff; color: #111; }
}

</style>

function loadTrip() {
  if (window.TRIP) return Promise.resolve(window.TRIP);
  const box = document.createElement("div");
  box.className = "trip-load-error";
  box.innerHTML = "<b>trip.js לא נטען.</b> ודאו שהקובץ <code>trip.js</code> קיים לצד ה-HTML, שהוא נטען לפני <code>trip-loader.js</code>, ושאין בו שגיאת תחביר (בדקו בקונסול).";
  document.body.prepend(box);
  return Promise.reject(new Error("window.TRIP is missing"));
}

    { key: "phuket", att: "phuket", name: "פוקט", hotelKey: "phuket", from: toPhuket, to: phuketEnd, nights: phuketNights,
      sub: "הבסיס הראשון — חוף פרטי, בריכות, והאי מסביב" },
    { key: "khaolak", att: dest2.id || "khaolak", name: dest2.name || "קאו לאק", hotelKey: "second", from: phuketEnd, to: dest2End, nights: dest2Nights,
      sub: "שקט, ג'ונגל וחוף ארוך — הסוף הרגוע של הטיול" }
  ];

  /* ---------- הירו ---------- */
  const firstNames = (trip.travelers || []).map(t => String(t.name).split(" ")[0]);
  const attCount = CH.reduce((n, c) => n + ((ATT[c.att] || []).length), 0);
  el("heroKick").textContent = `${dm(out.depDate)} – ${dm(back.arrDate)}.${d(back.arrDate).getFullYear()}`;
  el("heroLede").textContent = `${firstNames.join(", ")} — ${CH.length} יעדים, ${totalNights} לילות ואי אחד שלם באמצע.`;
  el("heroFacts").innerHTML = [
    [CH.length, "יעדים"], [totalNights, "לילות"], [DOMESTIC.length + 2, "טיסות"], [attCount, "מקומות לראות"]
  ].map(([n, l]) => `<li><b>${n}</b>${esc(l)}</li>`).join("");
  el("footUpdated").textContent = trip.updated ? `עודכן ${dm(trip.updated)}.${d(trip.updated).getFullYear()}` : "";

  /* ---------- ניווט דביק ---------- */
  el("chapNav").innerHTML = CH.map(c => `<a href="#ch-${c.key}" data-ch="${c.key}"><i></i>${esc(c.name)}</a>`).join("");

  /* ---------- רצועת הלילות ---------- */
  const where = s => {
    if (s < landBKK || s >= back.depDate) return "air";
    if (s < toPhuket) return "bangkok";
    if (s < phuketEnd) return "phuket";
    return "khaolak";
  };
  const days = [];
  for (let s = out.depDate; s <= back.arrDate; s = addDays(s, 1)) days.push(s);
  const today = iso(new Date());
  el("ribbon").innerHTML = days.map(s =>
    `<div class="d ${where(s)}${s === today ? " today" : ""}" title="${dm(s)} · ${esc(where(s) === "air" ? "במטוס" : CH.find(c => c.key === where(s)).name)}">${d(s).getDate()}</div>`
  ).join("");
  el("ribbonKey").innerHTML = CH.map(c => `<span class="${c.key}"><i></i><b>${esc(c.name)}</b> · ${nightsWord(c.nights)}</span>`).join("")
    + `<span class="air"><i></i><b>במטוס</b> · 2 לילות</span>`;

  /* ---------- טיסות / מעברים ---------- */
  const legCard = o => `
    <div class="leg rise">
      <div class="leg-top">
        <span class="leg-codes" dir="ltr">
          <b>${esc(o.a)}</b>
          <span class="arrow">${o.car ? ICON.car : ICON.plane}</span>
          <b>${esc(o.b)}</b>
        </span>
      </div>
      <p class="leg-when">${o.when}</p>
      ${o.tag ? `<p class="leg-tag">${esc(o.tag)}</p>` : ""}
      ${o.note ? `<p class="leg-note">${esc(o.note)}</p>` : ""}
    </div>`;

  const flightLeg = (f, label) => legCard({
    a: f.from.code, b: f.to.code,
    when: `<b>${esc(f.no)}</b> · יום ${esc(dow(f.depDate))} ${esc(dm(f.depDate))} · ${esc(f.depTime)} → ${esc(f.arrTime)}${f.arrNote ? " " + esc(f.arrNote) : ""}`,
    tag: `${esc(f.airline || FLIGHTS.airline)} · ${esc(f.dur)} ${f.direct ? "· ישיר" : ""} · ${esc(label)}`,
    note: f.guideNote || ""
  });

  /* ---------- מלון ---------- */
  const stayCard = (ch) => {
    const hb = hotels[ch.hotelKey] || {}, c = candOf(ch.hotelKey);
    const name = (c && c.name) || hb.name || "טרם נבחר מלון";
    const img = c && c.img && c.img[0];
    const rows = [
      ["חדר", c && c.room],
      ["הסעדה", (c && c.board) || hb.board],
      ["צ'ק-אין", `יום ${dow(ch.from)} ${dm(ch.from)}`],
      ["צ'ק-אאוט", `יום ${dow(ch.to)} ${dm(ch.to)}`],
      ["כתובת", c && c.address],
      ["הזמנה", hb.ref]
    ].filter(r => r[1]);
    return `
      <div class="stay rise">
        <div class="stay-img">
          <span class="label">איפה ישנים</span>
          ${img ? `<img src="${esc(img)}" alt="${esc(name)}" loading="lazy">` : ""}
          <h3>${esc(name)}</h3>
        </div>
        <div class="stay-body">
          ${c && c.area ? `<p class="stay-area">${esc(c.area)}</p>` : ""}
          <dl class="stay-kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
          ${c && c.note ? `<p class="stay-note">${esc(c.note.replace(/^נסגר [\d.]+ · /, ""))}</p>` : ""}
          <div class="links">
            ${c ? `<a class="primary" href="${esc(navUrl(null, { lat: c.lat, lng: c.lng }))}" target="_blank" rel="noopener">${ICON.pin}ניווט למלון</a>` : ""}
            ${c && c.site ? `<a href="${esc(c.site)}" target="_blank" rel="noopener">${ICON.ext}אתר המלון</a>` : ""}
          </div>
        </div>
      </div>`;
  };

  /* ---------- אטרקציה ---------- */
  const rideOf = a => {
    if (a.travel && a.travel.min) return { km: a.travel.km, min: a.travel.min, poly: (ROUTES[a.id] || {}).poly };
    const r = ROUTES[a.id];
    return r ? { km: r.km, min: r.min, poly: r.poly } : null;
  };

  const attCard = (a, hotel) => {
    const ride = rideOf(a);
    const peak = a.peak > 1 && ride ? Math.round(ride.min * a.peak) : 0;
    const meta = [
      a.tip ? ["💡", a.tip] : null,
      a.hours ? ["🕘", a.hours] : null
    ].filter(Boolean);
    return `
      <article class="att rise">
        <div class="att-map" data-att="${esc(a.id)}">
          ${ride && ride.poly ? schemSvg(ride.poly) : `<svg class="schem" viewBox="0 0 320 160"></svg>`}
          ${ride ? `<span class="ride">${ICON.car}<b>${ride.min} דק'</b><span>במונית · ${ride.km} ק"מ</span></span>` : ""}
          ${hotel ? `<a class="zoom" href="${esc(navUrl(hotel, a))}" target="_blank" rel="noopener">${ICON.expand}מסלול</a>` : ""}
        </div>
        <div class="att-body">
          <div class="att-top">
            <h4>${esc(a.name)}</h4>
            ${a.cat ? `<span class="cat${a.baby ? " baby" : ""}">${esc(a.cat)}${a.baby ? " 👶" : ""}</span>` : ""}
          </div>
          <p class="att-en" dir="ltr">${esc(a.en || "")}</p>
          <p class="att-blurb">${esc(a.blurb || "")}</p>
          ${peak ? `<p class="att-peak">בשעות העומס הנסיעה יכולה להגיע ל-${peak} דק'.</p>` : ""}
          ${meta.length ? `<div class="att-meta">${meta.map(([i, t]) => `<p><i>${i}</i>${esc(t)}</p>`).join("")}</div>` : ""}
          <div class="links">
            <a href="${esc(mapUrl({ lat: a.lat, lng: a.lng, q: a.en || a.name }))}" target="_blank" rel="noopener">${ICON.pin}במפה</a>
            ${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${ICON.ext}אתר</a>` : ""}
          </div>
        </div>
      </article>`;
  };

  /* ---------- מפה סכמטית (תמיד עובדת, גם בלי אינטרנט) ---------- */
  function decodePoly(str) {
    const pts = []; let i = 0, lat = 0, lng = 0;
    while (i < str.length) {
      let b, shift = 0, res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (res & 1) ? ~(res >> 1) : (res >> 1);
      shift = 0; res = 0;
      do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (res & 1) ? ~(res >> 1) : (res >> 1);
      pts.push([lat / 1e5, lng / 1e5]);
    }
    return pts;
  }

  function schemSvg(poly) {
    const pts = decodePoly(poly);
    if (pts.length < 2) return `<svg class="schem" viewBox="0 0 320 160"></svg>`;
    const W = 320, H = 160, P = 22;
    const lats = pts.map(p => p[0]), lngs = pts.map(p => p[1]);
    const la0 = Math.min(...lats), la1 = Math.max(...lats), lo0 = Math.min(...lngs), lo1 = Math.max(...lngs);
    const midLat = (la0 + la1) / 2, kx = Math.cos(midLat * Math.PI / 180);
    const w = Math.max((lo1 - lo0) * kx, 1e-5), h = Math.max(la1 - la0, 1e-5);
    const s = Math.min((W - 2 * P) / w, (H - 2 * P) / h);
    const ox = (W - w * s) / 2, oy = (H - h * s) / 2;
    const X = lng => ox + (lng - lo0) * kx * s;
    const Y = lat => oy + (la1 - lat) * s;
    const dPath = pts.map((p, i) => `${i ? "L" : "M"}${X(p[1]).toFixed(1)} ${Y(p[0]).toFixed(1)}`).join("");
    const a = pts[0], b = pts[pts.length - 1];
    const grid = [40, 80, 120].map(y => `<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`).join("")
      + [80, 160, 240].map(x => `<line class="grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`).join("");
    return `<svg class="schem" viewBox="0 0 ${W} ${H}" aria-hidden="true">
      ${grid}
      <path class="route" d="${dPath}"/>
      <circle cx="${X(a[1]).toFixed(1)}" cy="${Y(a[0]).toFixed(1)}" r="5" fill="#55CFC0" stroke="#0B1618" stroke-width="2"/>
      <circle cx="${X(b[1]).toFixed(1)}" cy="${Y(b[0]).toFixed(1)}" r="6" fill="#F3B054" stroke="#0B1618" stroke-width="2"/>
    </svg>`;
  }

  /* ---------- בנייה ---------- */
  let html = "";
  out.guideNote = "טיסת לילה — ארבל אמורה לישון רוב הדרך. נוחתים בבנגקוק בצהריים.";
  html += flightLeg({ ...out, airline: FLIGHTS.airline }, "הטיסה לתאילנד");

  CH.forEach((ch, i) => {
    const list = ATT[ch.att] || [];
    const c = candOf(ch.hotelKey);
    const hotelPt = c ? { lat: c.lat, lng: c.lng } : null;
    html += `
      <section class="chapter" id="ch-${ch.key}" data-ch="${ch.key}">
        <div class="ch-head rise">
          <span class="ch-num">0${i + 1}</span>
          <div>
            <h2>${esc(ch.name)}</h2>
            <p class="ch-when">${nightsWord(ch.nights)} · ${dm(ch.from)} → ${dm(ch.to)}</p>
            <p class="ch-sub">${esc(ch.sub)}</p>
          </div>
        </div>
        ${stayCard(ch)}
        <div class="sec-head rise"><h3>מה עושים כאן</h3><span>${list.length ? list.length + " מקומות · זמני נסיעה מהמלון" : ""}</span></div>
        ${list.length
          ? `<div class="att-grid">${list.map(a => attCard(a, hotelPt)).join("")}</div>`
          : `<p class="empty-att rise">עוד לא הוספנו אטרקציות ליעד הזה. מוסיפים אותן בקובץ attractions.js.</p>`}
      </section>`;

    if (i === 0) html += flightLeg({ ...dom, guideNote: dom.note }, "טיסה פנימית");
    if (i === 1) html += legCard({
      a: "פוקט", b: CH[2].name, car: true,
      when: `<b>נסיעה ברכב</b> · יום ${esc(dow(phuketEnd))} ${esc(dm(phuketEnd))}`,
      tag: "כשעה וחצי נסיעה · רכב פרטי עם כיסא בטיחות",
      note: "צ'ק-אאוט בפוקט בבוקר, ונוסעים צפונה לאורך החוף."
    });
    if (i === 2 && domBack) html += flightLeg({ ...domBack, guideNote: domBack.note }, "טיסה פנימית");
  });

  back.guideNote = "טיסת לילה הביתה — נוחתים בתל אביב בשבת בבוקר.";
  html += flightLeg({ ...back, airline: FLIGHTS.airline }, "הטיסה הביתה");
  el("flow").innerHTML = html;

  /* ---------- שדרוג המפות ל-Leaflet (רק אם האריחים נטענים) ---------- */
  const TILES = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";   // אריחים חופשיים; הכהייה נעשית ב-CSS
  const attIndex = {};
  CH.forEach(ch => { const c = candOf(ch.hotelKey); (ATT[ch.att] || []).forEach(a => { attIndex[a.id] = { a, hotel: c }; }); });

  const upgradeMap = box => {
    const rec = attIndex[box.dataset.att];
    const ride = rec && rideOf(rec.a);
    if (!rec || !rec.hotel || !ride || !ride.poly || box.dataset.up) return;
    box.dataset.up = "1";
    try {
      const line = decodePoly(ride.poly);
      const holder = document.createElement("div");
      holder.style.cssText = "position:absolute;inset:0;";
      box.insertBefore(holder, box.firstChild);
      const map = L.map(holder, {
        zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
        doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false, tap: false
      });
      L.tileLayer(TILES, { subdomains: "abc", maxZoom: 19 }).addTo(map);
      L.polyline(line, { color: "#0B1618", weight: 7, opacity: .55 }).addTo(map);
      L.polyline(line, { color: "#F3B054", weight: 3.4, opacity: .95 }).addTo(map);
      L.circleMarker([rec.hotel.lat, rec.hotel.lng], { radius: 6, color: "#0B1618", weight: 2, fillColor: "#55CFC0", fillOpacity: 1 })
        .bindTooltip("המלון", { direction: "top", opacity: .9 }).addTo(map);
      L.circleMarker([rec.a.lat, rec.a.lng], { radius: 7, color: "#0B1618", weight: 2, fillColor: "#F3B054", fillOpacity: 1 })
        .bindTooltip(rec.a.name, { direction: "top", opacity: .9 }).addTo(map);
      map.fitBounds(L.latLngBounds(line).pad(.12), { animate: false });
      const svg = box.querySelector("svg.schem");
      if (svg) svg.remove();
      setTimeout(() => map.invalidateSize(), 120);
    } catch (e) { /* נשארים עם הסכמטית */ }
  };

  let tilesOk = false;
  const pending = [];
  const probe = new Image();
  probe.onload = () => { tilesOk = true; pending.splice(0).forEach(upgradeMap); };
  probe.onerror = () => { pending.length = 0; };
  probe.src = "https://a.tile.openstreetmap.org/8/202/117.png";

  if ("IntersectionObserver" in window && typeof L !== "undefined") {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      if (tilesOk) upgradeMap(e.target); else pending.push(e.target);
    }), { rootMargin: "300px 0px" });
    document.querySelectorAll(".att-map").forEach(b => io.observe(b));
  }

  /* ---------- כניסה רכה + ניווט פעיל ---------- */
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if ("IntersectionObserver" in window && !reduce) {
    const rio = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); rio.unobserve(e.target); }
    }), { rootMargin: "0px 0px -8% 0px" });
    document.querySelectorAll(".rise").forEach(n => rio.observe(n));
  } else document.querySelectorAll(".rise").forEach(n => n.classList.add("in"));

  const navLinks = [...document.querySelectorAll(".chapnav a")];
  if ("IntersectionObserver" in window) {
    const sio = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      navLinks.forEach(a => a.classList.toggle("on", a.dataset.ch === e.target.dataset.ch));
    }), { rootMargin: "-45% 0px -50% 0px" });
    document.querySelectorAll(".chapter").forEach(s => sio.observe(s));
  }
  navLinks.forEach(a => a.addEventListener("click", ev => {
    const t = document.getElementById(a.getAttribute("href").slice(1));
    if (!t) return;
    ev.preventDefault();
    const top = t.getBoundingClientRect().top + scrollY - (document.querySelector(".chapnav").offsetHeight + 12);
    scrollTo({ top, behavior: reduce ? "auto" : "smooth" });
  }));
});

</script>
